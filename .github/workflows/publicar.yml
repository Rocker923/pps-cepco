# Publica la página en GitHub Pages cada vez que se sube un cambio a "main".
# Antes de publicar, indexa la carpeta media/ (fotos, planos, notas) para que
# aparezcan automáticamente en la actividad correspondiente.
name: Publicar página

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Indexar fotos, planos y notas
        run: python tools/indexar_medios.py

      - name: Preparar sitio
        run: |
          mkdir -p _site
          cp -r index.html assets data media _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: despliegue
        uses: actions/deploy-pages@v4
